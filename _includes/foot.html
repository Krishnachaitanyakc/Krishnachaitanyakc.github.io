<script>
(() => {
  const root = document.documentElement, b = document.getElementById("theme");
  const label = () => { const t = root.dataset.theme === "dark" ? "Switch to light mode" : "Switch to dark mode"; b.setAttribute("aria-label", t); b.title = t; };
  b.addEventListener("click", () => {
    if (root.dataset.theme === "dark") delete root.dataset.theme; else root.dataset.theme = "dark";
    try { localStorage.setItem("theme", root.dataset.theme || "light"); } catch (e) {}
    label();
  });
  label();
})();
</script>

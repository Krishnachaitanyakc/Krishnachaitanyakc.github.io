---
layout: default
---
<main class="page"><div class="wrap">
  <nav class="crumbs"><a href="/">Krishna Chaitanya Balusu</a> / <a href="/blog/">Blog</a></nav>
  <article class="post">
    <header>
      <h1>{{ page.title }}</h1>
      <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    </header>
    <div class="prose">
{% if page.external_url %}<p>Published on {{ page.venue | default: "another site" }}: <a href="{{ page.external_url }}">read the post there</a>.</p>{% else %}{{ content }}{% endif %}
    </div>
  </article>
